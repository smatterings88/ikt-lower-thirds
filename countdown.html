<title>I KNOW THAT! — Countdown</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
#stage{position:absolute;width:1920px;height:1080px;transform-origin:top left}
#testTag{position:absolute;top:28px;left:28px;z-index:5;padding:6px 12px;border-radius:999px;background:#ffdc35;color:#081b3a;font-size:14px;font-weight:800;letter-spacing:2px}
#overlay.is-gone{opacity:0}
#overlay.is-fading{opacity:0;transition:opacity .8s linear}
.pill{position:absolute;left:0;bottom:120px;width:1920px;background:rgba(8,27,58,.88);border-top:1px solid #ffffff30;overflow:hidden;filter:drop-shadow(0 8px 16px #0006);--glow:#ffdc35}
.pill[hidden],.finale[hidden],#testTag[hidden]{display:none!important}
.pill-main{display:flex;flex-direction:column;align-items:center;padding:16px 0 14px}
.cluster{display:flex;align-items:center;justify-content:center;gap:18px;transform-origin:center center}
.logo{width:108px;height:56px;object-fit:contain;flex:none}
.time{font-size:44px;font-weight:900;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.tag-row{min-height:0;text-align:center}
.tag{display:none;margin:8px 0 0;padding:6px 12px;border-radius:999px;background:#ffdc35;color:#081b3a;font-size:14px;font-weight:800;letter-spacing:1.6px}
.tag.on{display:inline-block}
.footer{height:4px;background:linear-gradient(90deg,#ff007f,#ff8a00,#ffdf00,#00d474,#00baff,#753aff,#ff007f)}
.pill[data-phase="ten"]{box-shadow:0 0 0 1px #ffdc3588,0 10px 22px #0007}
.pill[data-phase="five"],.pill[data-phase="two"],.pill[data-phase="one"]{--glow:#ff8a00;box-shadow:0 0 0 1px #ff8a00aa,0 10px 24px #0007}
.pill[data-phase="five"] .tag,.pill[data-phase="two"] .tag,.pill[data-phase="one"] .tag{background:#ff8a00;color:#1a0c00}
.pill[data-phase="one"] .cluster{transform:scale(1.08)}
.pill[data-phase="one"] .time{font-size:64px}
.footer.shimmer{background-size:200% 100%;animation:shimmer 3.2s linear infinite}
.finale{position:absolute;left:656px;width:608px;height:640px;top:50%;transform:translateY(-54%);display:flex;align-items:center;justify-content:center}
.burst{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ring{width:520px;height:520px;border-radius:50%;background:conic-gradient(from 0deg,#ff007f,#ff8a00,#ffdf00,#00d474,#00baff,#753aff,#ff007f);-webkit-mask:radial-gradient(circle,transparent 62%,#000 64%);mask:radial-gradient(circle,transparent 62%,#000 64%);animation:spin 2.8s linear infinite}
.scrim{position:absolute;left:50%;top:50%;width:430px;height:430px;margin:-215px 0 0 -215px;border-radius:50%;background:rgba(8,27,58,.88)}
.numeral{position:relative;font-size:260px;font-weight:900;letter-spacing:-10px;line-height:.85;font-variant-numeric:tabular-nums;text-shadow:0 8px 18px #000c}
.attention{animation:glow 1.1s ease-out 1}
.tag.enter{animation:tag-in .45s cubic-bezier(.16,1,.3,1) both}
.numeral.pop{animation:pop .38s cubic-bezier(.16,1,.3,1) both}
.burst.go{animation:burst .5s ease-out both}
@keyframes shimmer{from{background-position:0 0}to{background-position:200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%{box-shadow:0 0 0 0 transparent}35%{box-shadow:0 0 32px 8px var(--glow)}100%{box-shadow:0 8px 18px #0006}}
@keyframes tag-in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes burst{from{opacity:.3;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes steady{0%,100%{transform:scale(1.06)}50%{transform:scale(1.1)}}
@media(prefers-reduced-motion:no-preference){
  .pill[data-phase="one"] .cluster{animation:steady 1.6s ease-in-out infinite}
}
@media(prefers-reduced-motion:reduce){
  .footer.shimmer,.ring,.attention,.tag.enter,.numeral.pop,.burst.go,#overlay.is-fading{animation:none;transition:none}
  .pill[data-phase="one"] .cluster{transform:scale(1.08)}
}
</style>
</head>

<script>
(() => {
  const c = JSON.parse(document.getElementById('config').textContent);
  const q = new URLSearchParams(location.search);
  for (const key of ['time', 'tz', 'label', 'live', 'sound', 'test']) {
    if (q.has(key)) c[key] = q.get(key);
  }

  /* ZONE_MATH_START */
  function addCalendarDay(year, month, day) {
    const utc = new Date(Date.UTC(year, month - 1, day));
    utc.setUTCDate(utc.getUTCDate() + 1);
    return { year: utc.getUTCFullYear(), month: utc.getUTCMonth() + 1, day: utc.getUTCDate() };
  }
  function zonedParts(timeZone, utcMs) {
    const dtf = new Intl.DateTimeFormat('en-US', {
      timeZone: timeZone,
      hourCycle: 'h23',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
    });
    const map = {};
    for (const part of dtf.formatToParts(new Date(utcMs))) map[part.type] = part.value;
    let year = Number(map.year);
    let month = Number(map.month);
    let day = Number(map.day);
    let hour = Number(map.hour);
    if (hour === 24) {
      hour = 0;
      const next = addCalendarDay(year, month, day);
      year = next.year;
      month = next.month;
      day = next.day;
    }
    return { year: year, month: month, day: day, hour: hour, minute: Number(map.minute), second: Number(map.second) };
  }
  function zoneOffsetMs(timeZone, utcMs) {
    const parts = zonedParts(timeZone, utcMs);
    const asUtc = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
    return asUtc - utcMs;
  }
  function zonedWallTimeToUtc(timeZone, year, month, day, hour, minute, second) {
    const desired = Date.UTC(year, month - 1, day, hour, minute, second);
    let utc = desired;
    for (let pass = 0; pass < 2; pass++) utc = desired - zoneOffsetMs(timeZone, utc);
    return utc;
  }
  function nextShowUtc(nowMs, hour, minute, timeZone, liveSeconds) {
    const parts = zonedParts(timeZone, nowMs);
    let target = zonedWallTimeToUtc(timeZone, parts.year, parts.month, parts.day, hour, minute, 0);
    if (nowMs - target > liveSeconds * 1000) {
      const next = addCalendarDay(parts.year, parts.month, parts.day);
      target = zonedWallTimeToUtc(timeZone, next.year, next.month, next.day, hour, minute, 0);
    }
    return target;
  }
  /* ZONE_MATH_END */

  function clean(value, max) {
    return Array.from(String(value ?? '').replace(/[\r\n\t]/g, ' ')).slice(0, max).join('').trim();
  }
  function parseTime(value) {
    const match = /^(\d{1,2}):(\d{2})$/.exec(String(value || '').trim());
    if (!match) return { hour: 20, minute: 54 };
    const hour = Number(match[1]);
    const minute = Number(match[2]);
    if (hour > 23 || minute > 59) return { hour: 20, minute: 54 };
    return { hour: hour, minute: minute };
  }
  function validZone(name) {
    const zone = clean(name, 80) || 'America/New_York';
    try {
      new Intl.DateTimeFormat('en-US', { timeZone: zone }).format(0);
      return zone;
    } catch (e) {
      return 'America/New_York';
    }
  }
  function liveSeconds(value) {
    const n = Number(value);
    if (!Number.isFinite(n)) return 30;
    return Math.min(3600, Math.max(0, Math.round(n)));
  }
  function flag(value) {
    return value === true || value === 'true' || value === '1';
  }
  function parseTest(value) {
    if (value === undefined || value === null || value === '') return null;
    const n = Number(value);
    if (!Number.isFinite(n) || n < 0) return null;
    return n;
  }
  function phaseFor(ms) {
    if (ms > 600000) return 'calm';
    if (ms > 300000) return 'ten';
    if (ms > 120000) return 'five';
    if (ms > 60000) return 'two';
    if (ms > 10000) return 'one';
    if (ms > 0) return 'finale';
    return 'hidden';
  }
  function displaySeconds(ms) {
    if (ms <= 0) return 0;
    return Math.ceil(ms / 1000);
  }
  function formatRemaining(total) {
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    const pad = (n) => String(n).padStart(2, '0');
    if (h > 0) return h + ':' + pad(m) + ':' + pad(s);
    return pad(m) + ':' + pad(s);
  }
  const clock = parseTime(c.time);
  const tz = validZone(c.tz);
  const live = liveSeconds(c.live);
  const soundOn = flag(c.sound);
  const testSeconds = parseTest(c.test);
  const testAnchor = Date.now();
  const tags = { ten: '10 MINUTES', five: '5 MINUTES', two: '2 MINUTES', one: '1 MINUTE' };
  const cueHz = { ten: 880, five: 988, two: 1175, one: 1319 };

  const overlay = document.getElementById('overlay');
  const pill = document.querySelector('.pill');
  const footer = pill.querySelector('.footer');
  const tag = document.querySelector('.tag');
  const timeEl = document.querySelector('.time');
  const finale = document.querySelector('.finale');
  const numeral = document.querySelector('.numeral');
  const burst = document.querySelector('.burst');
  let skew = 0;
  let lastPhase = null;
  let lastDigits = '';
  let lastFinale = null;
  let tagTimer = 0;
  let audioContext = null;

  if (testSeconds != null) document.getElementById('testTag').hidden = false;

  function nowMs() {
    return Date.now() + (testSeconds == null ? skew : 0);
  }
  function remainingMs() {
    if (testSeconds != null) return testAnchor + testSeconds * 1000 - Date.now();
    return nextShowUtc(nowMs(), clock.hour, clock.minute, tz, live) - nowMs();
  }
  function beep(freq, seconds, gain) {
    if (!soundOn) return;
    try {
      if (!audioContext) audioContext = new AudioContext();
      if (audioContext.state === 'suspended') audioContext.resume();
      const osc = audioContext.createOscillator();
      const amp = audioContext.createGain();
      const t = audioContext.currentTime;
      osc.type = 'sine';
      osc.frequency.value = freq;
      amp.gain.setValueAtTime(gain, t);
      amp.gain.exponentialRampToValueAtTime(0.001, t + seconds);
      osc.connect(amp);
      amp.connect(audioContext.destination);
      osc.start(t);
      osc.stop(t + seconds);
    } catch (e) {}
  }
  function showSettledTag(text) {
    tag.textContent = text;
    tag.classList.add('on', 'settled');
    tag.classList.remove('enter');
    pill.classList.remove('attention');
  }
  function playCue(phase) {
    tag.textContent = tags[phase];
    tag.classList.add('on', 'enter');
    tag.classList.remove('settled');
    pill.classList.remove('attention');
    void pill.offsetWidth;
    pill.classList.add('attention');
    clearTimeout(tagTimer);
    tagTimer = setTimeout(() => {
      tag.classList.remove('enter');
      tag.classList.add('settled');
      pill.classList.remove('attention');
    }, 4000);
    beep(cueHz[phase], phase === 'one' ? 0.22 : 0.14, 0.08);
  }
  function showNumeral(n, animate) {
    numeral.textContent = String(n);
    if (!animate) return;
    numeral.classList.remove('pop');
    burst.classList.remove('go');
    void numeral.offsetWidth;
    numeral.classList.add('pop');
    burst.classList.add('go');
  }
  function render() {
    const ms = remainingMs();
    const phase = phaseFor(ms);
    const crossed = lastPhase !== null && phase !== lastPhase;
    if (phase === 'hidden') {
      overlay.classList.add('is-gone');
      overlay.classList.remove('is-fading');
    } else {
      overlay.classList.remove('is-gone', 'is-fading');
    }
    const showPill = phase === 'calm' || phase === 'ten' || phase === 'five' || phase === 'two' || phase === 'one';
    pill.hidden = !showPill;
    finale.hidden = phase !== 'finale';
    if (showPill) {
      pill.dataset.phase = phase;
      footer.classList.toggle('shimmer', phase === 'two' || phase === 'one');
      const digits = formatRemaining(displaySeconds(ms));
      if (digits !== lastDigits) {
        timeEl.textContent = digits;
        lastDigits = digits;
      }
      if (tags[phase]) {
        if (crossed) playCue(phase);
        else if (!tag.classList.contains('on') || tag.textContent !== tags[phase]) showSettledTag(tags[phase]);
      } else {
        tag.classList.remove('on', 'enter', 'settled');
        tag.textContent = '';
        pill.classList.remove('attention');
      }
    }
    if (phase === 'finale') {
      const n = displaySeconds(ms);
      if (n !== lastFinale) {
        showNumeral(n, lastFinale !== null || crossed);
        if ((lastFinale !== null || crossed) && n >= 1 && n <= 10) beep(620 + (11 - n) * 45, n === 1 ? 0.28 : 0.09, n === 1 ? 0.12 : 0.07);
        lastFinale = n;
      }
    } else {
      lastFinale = null;
    }
    lastPhase = phase;
  }

  async function syncSkew() {
    if (testSeconds != null) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    if (!location.origin || location.origin === 'null' || window.origin === 'null') return;
    try {
      const response = await fetch(location.origin + location.pathname, { method: 'HEAD', cache: 'no-store' });
      const header = response.headers.get('Date');
      if (!header) return;
      const server = Date.parse(header);
      if (!Number.isFinite(server)) return;
      const diff = server - Date.now();
      skew = Math.abs(diff) > 2000 ? diff : 0;
    } catch (e) {}
  }

  function fit() {
    document.getElementById('stage').style.transform = 'scale(' + Math.min(innerWidth / 1920, innerHeight / 1080) + ')';
  }
  addEventListener('resize', fit);
  fit();
  render();
  requestAnimationFrame(function loop() {
    render();
    requestAnimationFrame(loop);
  });
  setInterval(render, 250);
  document.addEventListener('visibilitychange', render);
  syncSkew();
  setInterval(syncSkew, 5 * 60 * 1000);
})();
</script>
</body>
</html>
